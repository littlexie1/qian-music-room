<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>千小姐的音乐室</title><link rel="stylesheet" href="/style.css?v=lyrics-1"></head><body>
<aside class="sidebar"><div class="brand">◈ <span>千小姐的音乐室<small>QWEN MUSIC ROOM</small></span></div><div class="section-label">你的音乐，慢慢听</div><nav><button data-view="daily" class="active">✦ 每日推荐</button><button data-view="liked">♡ 我喜欢的音乐</button><button data-view="created">▤ 我的歌单</button><button data-view="collected">◇ 收藏歌单</button></nav><button id="activity-records" class="activity-entry">◷ 记录</button><div class="sidebar-bottom"><div class="online"></div><span id="account">正在连接网易云…</span><small>原有账号 · 网易云音乐</small></div></aside>
<main><header><div><small id="eyebrow">FOR YOUR EVERYDAY</small><h1 id="title">今天，想听什么？</h1></div><form id="search"><input id="query" placeholder="搜索歌曲、歌手或歌单" autocomplete="off"><select id="search-type"><option value="song">歌曲</option><option value="playlist">歌单</option></select><button>搜索</button></form></header>
<section class="hero" id="hero"><div><span class="tag">一起把喜欢的声音找出来</span><h2>随便听听，<br>也能遇见心动。</h2><p>你的歌单、你的日推，还有一位陪你听歌的大小姐。</p><button id="play-all">▶ 播放这份推荐</button></div><div class="hero-art"><img src="/qwen.png" alt="千小姐"></div><div class="orbit">♫</div></section>
<div class="content-heading"><h2 id="list-title">为你推荐</h2><button id="playlist-comments" hidden>评论</button><button id="collect-current-playlist" hidden>☆ 收藏歌单</button><span id="count"></span></div><div id="notice" role="status"></div><section id="library"></section><button id="more" hidden>加载更多</button></main>
<aside class="chat"><div class="chat-heading"><span class="avatar"><img src="/qwen.png" alt=""></span><div><b>千小姐</b><small>陪你听，也陪你找</small></div><button id="new-conversation" title="新对话，使用独立上下文">＋ 新对话</button></div><div class="conversation-bar"><select id="conversation-select" aria-label="切换对话"></select><span id="background-conversations"></span></div><div id="messages"><div class="bubble assistant">告诉我想听什么，我会自己找歌、试听筛选，再整理成你的网易云歌单。<br>比如：找 5 首适合夜里放松的歌，别太闷。</div></div><div id="ai-status"></div><section id="agent-progress" hidden><div class="progress-heading"><b id="agent-phase"></b><button id="toggle-progress" aria-expanded="false" aria-controls="progress-details">展开</button><button id="stop-agent">停止</button></div><div id="progress-details" hidden><small id="progress-counts"></small><div id="progress-plan"></div><div id="progress-playlists"></div><div id="progress-error"></div></div></section><div class="suggestions"><button id="listen">♫ 听听当前歌曲</button></div><div id="pending-media" aria-live="polite"></div><div class="media-toolbar"><button id="attach-media" type="button">📎 音频 / 视频</button><button id="record-voice" type="button" aria-pressed="false">🎙 语音</button><input id="media-file" type="file" accept="audio/*,video/*" multiple hidden></div><form id="chat-form"><textarea id="message" rows="2" placeholder="想听什么，直接和我说吧"></textarea><button id="send" title="发送">↑</button></form><small id="compose-hint"></small><small class="chat-foot">Qwen Omni · 原生音频聆听</small></aside>
<footer><div class="now"><button id="now-cover-button" class="no-cover" title="选一首歌曲后查看歌词" aria-label="展开当前歌曲歌词" aria-controls="lyrics-panel" aria-expanded="false" disabled><img id="now-cover" alt="当前歌曲封面" hidden><span class="cover-placeholder" aria-hidden="true">♫</span></button><div><b id="now-name">还没有播放</b><small id="now-artist">选一首喜欢的歌开始吧</small></div><button id="now-like" title="红心当前歌曲" disabled>♡</button><button id="now-add" title="添加当前歌曲到歌单" disabled>＋</button><button id="now-comments" title="当前歌曲评论" disabled>评</button></div><div class="transport"><div class="controls"><button id="play-mode" title="切换播放模式">顺序</button><button id="prev" title="上一首">◀</button><button id="toggle" title="播放 / 暂停">▶</button><button id="next" title="下一首">▶</button></div><div class="timeline"><span id="elapsed">0:00</span><input type="range" id="seek" min="0" max="100" value="0"><span id="duration">0:00</span></div></div><div class="volume">♫ <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5"><button id="queue-button" title="当前播放列表">☷ <span id="queue-count">0 首</span></button></div></footer><dialog id="comments-panel"><div class="comments-heading"><div><h2>评论</h2><small id="comments-resource"></small></div><span id="comments-total"></span><button id="close-comments" aria-label="关闭评论">✕</button></div><div id="comments-status" role="status"></div><div id="comments-list"></div><button id="comments-more" hidden>加载更多评论</button></dialog><dialog id="playlist-picker"><div class="picker-heading"><div><h2>添加到歌单</h2><small id="picker-song"></small></div><button id="close-picker" aria-label="关闭">✕</button></div><form id="create-add-playlist"><input id="new-playlist-name" placeholder="新歌单名称" required><button>新建并添加</button></form><div id="picker-status" role="status"></div><div id="picker-list"></div></dialog><dialog id="queue-panel"><div class="queue-heading"><div><h2>当前播放列表</h2><small id="queue-info"></small></div><button id="clear-queue">清空</button><button id="close-queue" aria-label="关闭播放列表">✕</button></div><div id="queue-list"></div></dialog><dialog id="activity-panel"><div class="activity-heading"><h2>记录</h2><button id="close-activity" aria-label="关闭记录">✕</button></div><div class="activity-toolbar"><select id="activity-kind" aria-label="记录类型"><option value="local">本机播放记录</option><option value="netease">网易云最近记录</option><option value="notes">千小姐的试听笔记</option><option value="timers">当前对话的定时操作</option></select><button id="refresh-activity">刷新</button></div><p id="activity-status" role="status"></p><div id="activity-list"></div><button id="activity-more" hidden>加载更多</button></dialog><dialog id="lyrics-panel" aria-labelledby="lyrics-title"><div class="lyrics-heading"><span>歌曲与歌词</span><button id="close-lyrics" aria-label="收起歌词">⌄ 收起</button></div><div class="lyrics-layout"><section class="lyrics-art"><div class="lyrics-disc"><img id="lyrics-cover" alt="当前歌曲封面"></div><h2 id="lyrics-title"></h2><p id="lyrics-artist"></p></section><section class="lyrics-text"><div class="lyrics-status-row"><p id="lyrics-status" role="status"></p><button id="lyrics-retry" hidden>重试</button><button id="lyrics-follow" hidden>回到当前歌词</button></div><div id="lyrics-lines" aria-label="歌词"></div></section></div></dialog><audio id="audio" preload="metadata"></audio><script src="/conversation-app.js?v=lyrics-1"></script><script src="/player-remote.js?v=media-1"></script><script src="/player-schedules.js?v=media-1"></script><script src="/activity-records.js?v=media-1"></script><script src="/media-input.js?v=media-1"></script><script src="/lyrics.js?v=lyrics-1"></script></body></html>
